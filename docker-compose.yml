services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: policyqa
      POSTGRES_PASSWORD: policyqa # local-only dev password
      POSTGRES_DB: policyqa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policyqa"]
      interval: 2s
      retries: 30

volumes:
  pgdata:
