name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: policyqa
          POSTGRES_PASSWORD: policyqa # CI-only throwaway password
          POSTGRES_DB: policyqa
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U policyqa"
          --health-interval 2s
          --health-retries 30
    env:
      DATABASE_URL: postgres://policyqa:policyqa@localhost:5432/policyqa
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
