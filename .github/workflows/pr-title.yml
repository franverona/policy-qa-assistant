name: PR title

# Squash merges use the PR title as the commit message, so lint it like one.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint the title
        run: echo "$TITLE" | pnpm exec commitlint
        env:
          TITLE: ${{ github.event.pull_request.title }}
